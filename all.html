<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Photos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 40px 20px;
    }
    header {
      max-width: 1400px;
      margin: 0 auto 40px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    h1 { font-size: 24px; font-weight: 500; letter-spacing: 0.5px; }
    a { color: #aaa; text-decoration: none; font-size: 14px; }
    a:hover { color: #fff; }
    .grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 4px;
    }
    .grid img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      transition: opacity 0.2s;
    }
    .grid img:hover { opacity: 0.75; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>All Photos</h1>
    <a href="index.html">← Back</a>
  </header>
  <div class="grid" id="grid"></div>
  <script src="config.js"></script>
  <script>
    const grid = document.getElementById("grid");
    const pad = (n) => String(n).padStart(3, "0");

    for (let n = 1; n <= POOL_SIZE; n++) {
      const img = document.createElement("img");
      img.src = `images/site${pad(n)}.jpg`;
      img.loading = "lazy";  // critical for 200+ images
      img.alt = `Photo ${n}`;
      grid.appendChild(img);
    }
  </script>
</body>
</html>
